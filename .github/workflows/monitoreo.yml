name: Monitoreo de anegamiento — Añelo

on:
  schedule:
    # Cada 2 horas, en punto. GitHub Actions usa UTC.
    - cron: "0 */2 * * *"
  workflow_dispatch:        # permite disparar la corrida a mano desde la web
  push:
    branches: [main]
    paths:
      - "src/**"
      - "main.py"
      - ".github/workflows/monitoreo.yml"

permissions:
  contents: write           # necesario para commitear los datos de vuelta al repo

concurrency:
  group: monitoreo
  cancel-in-progress: false # nunca cancelar una corrida a mitad de escritura

jobs:
  monitorear:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Tests de la matriz de riesgo
        run: python -m unittest discover -s tests -v

      - name: Ejecutar monitoreo
        env:
          # --- Notificaciones (opcionales) ---
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # --- Google Sheets (opcional) ---
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
          GOOGLE_SHEETS_ID: ${{ vars.GOOGLE_SHEETS_ID }}
          # --- SMN API interna (opcional; el sistema usa el feed CAP público) ---
          SMN_API_TOKEN: ${{ secrets.SMN_API_TOKEN }}
          # --- Calibración (opcional; por defecto 0.45) ---
          IIE_POROSIDAD_TOTAL: ${{ vars.IIE_POROSIDAD_TOTAL }}
        run: python main.py

      - name: Commitear datos y tablero
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          if git diff --staged --quiet; then
            echo "Sin cambios que commitear."
          else
            NIVEL=$(python -c "import json;print(json.load(open('data/estado_actual.json'))['nivel_consolidado'].upper())")
            git commit -m "datos: corrida automática — nivel ${NIVEL} [skip ci]"
            # Reintento ante carrera con otra corrida
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push origin main && break
              echo "Reintento de push $i"; sleep 5
            done
          fi

      - name: Publicar resumen en el run
        if: always()
        run: |
          if [ -f data/estado_actual.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          e = json.load(open("data/estado_actual.json"))
          ico = {"verde": "🟢", "amarillo": "🟡", "rojo": "🔴"}
          print(f"## {ico[e['nivel_consolidado']]} Corredor Añelo: **{e['nivel_consolidado'].upper()}**")
          print(f"\n_{e['accion_recomendada']}_\n")
          print(f"Actualizado: `{e['timestamp_local']}` (ART)\n")
          print("| Punto | Nivel | IIE | Lluvia ref. | Saturación suelo | Alerta SMN |")
          print("|---|---|---:|---:|---:|---|")
          for p in e["puntos"]:
              print(f"| {p['punto_nombre']} | {ico[p['nivel']]} {p['nivel'].upper()} "
                    f"| {p['iie']} | {p['precip_referencia_mm']} mm "
                    f"| {p['saturacion_suelo_pct']} % | {p['alerta_smn_color'] or '—'} |")
          PY
          fi
